<content><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Gym - 7 Exercises Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1B998B 0%, #2C3E50 100%);
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
    }

    .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
    }

    .header h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header .subtitle {
        font-size: 1.3rem;
        opacity: 0.9;
        margin-bottom: 5px;
    }

    .header .tagline {
        font-size: 1rem;
        opacity: 0.8;
        font-style: italic;
    }

    .islamic-star {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .exercises-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
        justify-items: center;
    }

    .exercise-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
        max-width: 400px;
        width: 100%;
    }

    .exercise-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #D4AF37, #1B998B);
    }

    .exercise-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }

    .exercise-card.expanded {
        background: linear-gradient(135deg, #F8F5F1 0%, #E8E5E1 100%);
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .exercise-title {
        font-size: 1.4rem;
        color: #2C3E50;
        font-weight: bold;
    }

    .exercise-target {
        color: #1B998B;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .checkboxes {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .day-checkbox {
        width: 50px;
        height: 40px;
        border: 2px solid #D4AF37;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.7rem;
        color: #666;
    }

    .day-checkbox:hover {
        background: #F8F5F1;
    }

    .day-checkbox.checked {
        background: #1B998B;
        border-color: #1B998B;
        color: white;
    }

    .virtues {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
    }

    .virtues.show {
        max-height: 500px;
    }

    .virtues-title {
        color: #D4AF37;
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 10px;
        margin-top: 10px;
    }

    .virtue-item {
        padding: 8px 0;
        padding-left: 20px;
        position: relative;
        color: #2C3E50;
        line-height: 1.6;
    }

    .virtue-item::before {
        content: '✦';
        position: absolute;
        left: 0;
        color: #D4AF37;
    }

    .progress-section {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .progress-title {
        font-size: 1.5rem;
        color: #2C3E50;
        margin-bottom: 20px;
        text-align: center;
    }

    .progress-bar {
        background: #E8E5E1;
        height: 30px;
        border-radius: 15px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .progress-fill {
        background: linear-gradient(90deg, #1B998B, #D4AF37);
        height: 100%;
        transition: width 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        min-width: 50px;
    }

    .btn {
        background: linear-gradient(135deg, #D4AF37, #1B998B);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        margin: 10px;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }

    .buttons-container {
        text-align: center;
        margin-top: 20px;
    }

    @media (max-width: 768px) {
        .exercises-grid {
            grid-template-columns: 1fr;
        }

        .header h1 {
            font-size: 2rem;
        }

        .header .subtitle {
            font-size: 1.1rem;
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="islamic-star">✦</div>
            <h1>🏋️‍♀️ Spiritual Gym</h1>
            <p class="subtitle">7 Exercises to Build Your Spiritual Strength</p>
            <p class="tagline">Reps + Consistency = Stronger Relationship with Allah</p>
        </div>
    <div class="progress-section">
        <h2 class="progress-title">💪 Your Weekly Spiritual Workout</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
        </div>
    </div>

    <div class="exercises-grid" id="exercisesGrid"></div>

    <div class="buttons-container">
        <button class="btn" onclick="alert('Take a screenshot and post it in the Ramadan Spiritual Gym group chat! 📸💪')">📄 Share Your Progress</button>
        <button class="btn" onclick="resetProgress()">🔄 Start New Week</button>
    </div>
</div>

<script>
    const exercises = [
        {
            name: "The 4 T's",
            target: "After each Salah",
            virtues: [
                "Glorifies Allah through 4 powerful statements (Tasbih, Tahmid, Takbir, Tahleel)",
                "Builds spiritual strength through repetition",
                "Purifies speech and strengthens Iman",
                "Expels Shaytan and fills life with peace"
            ]
        },
        {
            name: "Istighfar",
            target: "1000x a day",
            virtues: [
                "Cleans the heart like washing dishes",
                "Turns bad deeds into good deeds",
                "Source of wealth, provision & strength",
                "Relief from anxiety & key to Jannah"
            ]
        },
        {
            name: "Salawat ﷺ",
            target: "100x a day",
            virtues: [
                "Shows gratitude to Prophet Muhammad ﷺ",
                "Brings Allah's mercy upon you",
                "Angels make dua for you",
                "Saved your Dunya and Akhira"
            ]
        },
        {
            name: "Dua",
            target: "Sujood of Salah",
            virtues: [
                "Direct conversation with Allah",
                "The more you ask, the more Allah loves it",
                "Your weapon of protection & provision",
                "Allah responds when done with sincerity"
            ]
        },
        {
            name: "Quran",
            target: "1 page a day",
            virtues: [
                "Personal love letter from Allah to you",
                "Guidance for Dunya and Akhira",
                "Full of Barakah (blessings)",
                "Allah rewards you multiples for each letter"
            ]
        },
        {
            name: "Tahajjud",
            target: "2 units",
            virtues: [
                "Most virtuous prayer after Fard",
                "Allah smiles at those who wake for Him",
                "Enter Jannah with no accountability",
                "Changes you physically, mentally & spiritually"
            ]
        },
        {
            name: "Athkar",
            target: "Morning & Evening",
            virtues: [
                "Daily protection from evil",
                "Morning: After Fajr | Evening: After Asr",
                "Prophet ﷺ never missed it",
                "Shield for your day and night"
            ]
        }
    ];

    let progress = {};

    function initializeProgress() {
        const saved = localStorage.getItem('spiritualGym');
        if (saved) {
            progress = JSON.parse(saved);
        } else {
            exercises.forEach((ex, i) => {
                progress[i] = [false, false, false, false, false, false, false];
            });
        }
    }

    function saveProgress() {
        localStorage.setItem('spiritualGym', JSON.stringify(progress));
        updateProgressBar();
    }

    function updateProgressBar() {
        const total = 7 * 7;
        const completed = Object.values(progress).flat().filter(Boolean).length;
        const percentage = Math.round((completed / total) * 100);
        document.getElementById('progressFill').style.width = percentage + '%';
        document.getElementById('progressFill').textContent = percentage + '%';
    }

    function toggleDay(exerciseIndex, dayIndex) {
        progress[exerciseIndex][dayIndex] = !progress[exerciseIndex][dayIndex];
        saveProgress();
        renderExercises();
    }

    function toggleVirtues(exerciseIndex) {
        const card = document.getElementById(`card-${exerciseIndex}`);
        const virtues = document.getElementById(`virtues-${exerciseIndex}`);
        card.classList.toggle('expanded');
        virtues.classList.toggle('show');
    }

    function renderExercises() {
        const grid = document.getElementById('exercisesGrid');
        grid.innerHTML = '';

        exercises.forEach((exercise, i) => {
            const card = document.createElement('div');
            card.className = 'exercise-card';
            card.id = `card-${i}`;
            
            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            let checkboxes = '';
            for (let day = 0; day < 7; day++) {
                const checked = progress[i][day] ? 'checked' : '';
                checkboxes += `
                    <div class="day-checkbox ${checked}" onclick="event.stopPropagation(); toggleDay(${i}, ${day})">
                        ${checked ? '✓' : dayNames[day]}
                    </div>
                `;
            }

            let virtuesList = '';
            exercise.virtues.forEach(virtue => {
                virtuesList += `<div class="virtue-item">${virtue}</div>`;
            });

            card.innerHTML = `
                <div class="exercise-header">
                    <div class="exercise-title">${exercise.name}</div>
                    <div class="exercise-target">${exercise.target}</div>
                </div>
                <div class="checkboxes">
                    ${checkboxes}
                </div>
                <div class="virtues" id="virtues-${i}">
                    <div class="virtues-title">✦ Virtues:</div>
                    ${virtuesList}
                </div>
            `;

            card.onclick = () => toggleVirtues(i);
            grid.appendChild(card);
        });

        updateProgressBar();
    }

    function resetProgress() {
        if (confirm('Start a new week? This will reset all your current progress.')) {
            exercises.forEach((ex, i) => {
                progress[i] = [false, false, false, false, false, false, false];
            });
            saveProgress();
            renderExercises();
        }
    }

    // Initialize on page load
    initializeProgress();
    renderExercises();
</script>
</body>
</html></content>
